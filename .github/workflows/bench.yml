name: ⚡ Continuous Benchmarking & Regression Tracker

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  benchmark:
    name: Run Microbenchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Benchmarks
        run: |
          cargo bench -p spec-stream --bench verification_bench -- --output-format bencher | tee benchmark_output.txt

      - name: Store and Compare Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        continue-on-error: true
        with:
          name: Spec-Stream Rust Microbenchmarks
          tool: 'cargo'
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-on-alert: true
          alert-threshold: '120%'
          fail-on-alert: false
          summary-always: true

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_output.txt
