name: 🚀 Release & Crates.io Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (validate packaging without publishing to crates.io)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write # Required for Trusted Publishing (OIDC) on crates.io

jobs:
  validate-and-publish:
    name: Validate and Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache Setup
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        run: cargo test --workspace --all-targets

      - name: Verify Workspace Packaging
        run: |
          cargo package -p spec-stream-core --no-verify
          cargo package -p spec-stream-cache --no-verify
          cargo package -p spec-stream-engine --no-verify
          cargo package -p spec-stream --no-verify
          cargo package -p spec-stream-server --no-verify

      - name: Publish spec-stream-core
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: skipping upload for spec-stream-core"
            cargo publish -p spec-stream-core --dry-run
          else
            cargo publish -p spec-stream-core || true
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index sync (30s)
        if: inputs.dry_run != true
        run: sleep 30

      - name: Publish spec-stream-cache
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: skipping upload for spec-stream-cache"
            cargo publish -p spec-stream-cache --dry-run
          else
            cargo publish -p spec-stream-cache || true
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index sync (30s)
        if: inputs.dry_run != true
        run: sleep 30

      - name: Publish spec-stream-engine
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: skipping upload for spec-stream-engine"
            cargo publish -p spec-stream-engine --dry-run
          else
            cargo publish -p spec-stream-engine || true
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index sync (30s)
        if: inputs.dry_run != true
        run: sleep 30

      - name: Publish spec-stream (Facade)
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: skipping upload for spec-stream"
            cargo publish -p spec-stream --dry-run
          else
            cargo publish -p spec-stream || true
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index sync (30s)
        if: inputs.dry_run != true
        run: sleep 30

      - name: Publish spec-stream-server
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: skipping upload for spec-stream-server"
            cargo publish -p spec-stream-server --dry-run
          else
            cargo publish -p spec-stream-server || true
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Generate GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
