name: 🚀 Release & Crates.io Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Required for Trusted Publishing (OIDC) on crates.io

jobs:
  validate-and-publish:
    name: Validate and Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache Setup
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        run: cargo test --workspace --all-targets

      - name: Verify Workspace Packaging (Dry Run)
        run: |
          cargo package -p spec-stream-core --no-verify
          cargo package -p spec-stream-cache --no-verify
          cargo package -p spec-stream-engine --no-verify
          cargo package -p spec-stream --no-verify
          cargo package -p spec-stream-server --no-verify

      - name: Publish spec-stream-core
        run: cargo publish -p spec-stream-core || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index sync (30s)
        run: sleep 30

      - name: Publish spec-stream-cache
        run: cargo publish -p spec-stream-cache || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index sync (30s)
        run: sleep 30

      - name: Publish spec-stream-engine
        run: cargo publish -p spec-stream-engine || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index sync (30s)
        run: sleep 30

      - name: Publish spec-stream (Facade)
        run: cargo publish -p spec-stream || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index sync (30s)
        run: sleep 30

      - name: Publish spec-stream-server
        run: cargo publish -p spec-stream-server || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Generate GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
