name: 🦀 MSRV (Minimum Supported Rust Version) Verification

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Check Rust 1.75.0 Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust 1.75.0 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75.0"

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Workspace Compiles on MSRV
        run: cargo check --workspace --all-targets
