# Configuration for PR Labeler (actions/labeler@v5)

core:
  - changed-files:
      - any-glob-to-any-file: 'crates/spec-stream-core/**'

cache:
  - changed-files:
      - any-glob-to-any-file: 'crates/spec-stream-cache/**'

engine:
  - changed-files:
      - any-glob-to-any-file: 'crates/spec-stream-engine/**'

server:
  - changed-files:
      - any-glob-to-any-file: 'crates/spec-stream-server/**'

client:
  - changed-files:
      - any-glob-to-any-file: 'crates/spec-stream/**'

ui:
  - changed-files:
      - any-glob-to-any-file:
          - 'index.html'
          - 'assets/**'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

security:
  - changed-files:
      - any-glob-to-any-file:
          - 'deny.toml'
          - 'SECURITY.md'
          - '.github/workflows/security-audit.yml'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.lock'
          - '**/Cargo.toml'
