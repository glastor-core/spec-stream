[workspace]
members = [
    "crates/spec-stream-core",
    "crates/spec-stream-cache",
    "crates/spec-stream-engine",
    "crates/spec-stream",
    "crates/spec-stream-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["GLASTOR® Core <ventas@glastor.es>", "Andrés Antonio Cardoso <glastor.info@gmail.com>"]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glastor-core/spec-stream"
homepage = "https://glastor-core.github.io/spec-stream/"
readme = "README.md"
keywords = ["llm", "speculative-decoding", "kv-cache", "inference", "ai"]
categories = ["algorithms", "asynchronous", "concurrency"]

[workspace.dependencies]
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures-core = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
smallvec = "1.13"

