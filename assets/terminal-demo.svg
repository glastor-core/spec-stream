<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" aria-label="glastor-core/spec-stream — zsh (80x14)">
  <style>
        .term-font { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes revealCmd { 0% { opacity: 0; } 5%, 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .cmd-line { opacity: 0; animation: revealCmd 8s linear infinite; }
    @keyframes l0 { 0%, 16% { opacity: 0; } 19%, 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .row-0 { opacity: 0; animation: l0 8s linear infinite; }
    @keyframes l1 { 0%, 24% { opacity: 0; } 27%, 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .row-1 { opacity: 0; animation: l1 8s linear infinite; }
    @keyframes l2 { 0%, 32% { opacity: 0; } 35%, 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .row-2 { opacity: 0; animation: l2 8s linear infinite; }
    @keyframes l3 { 0%, 40% { opacity: 0; } 43%, 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .row-3 { opacity: 0; animation: l3 8s linear infinite; }
    @keyframes l4 { 0%, 48% { opacity: 0; } 51%, 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .row-4 { opacity: 0; animation: l4 8s linear infinite; }
    @keyframes l5 { 0%, 56% { opacity: 0; } 59%, 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .row-5 { opacity: 0; animation: l5 8s linear infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- Outer Window -->
  <rect x="1" y="1" width="858" height="288" rx="12" fill="url(#bg)" stroke="#f97316" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Titlebar -->
  <path d="M 13 1 H 847 A 12 12 0 0 1 859 13 V 38 H 1 V 13 A 12 12 0 0 1 13 1 Z" fill="url(#bar)"/>
  <line x1="1" y1="38" x2="859" y2="38" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="430" y="24" text-anchor="middle" fill="#9ca3af" class="title-font">glastor-core/spec-stream — zsh (80x14)</text>
  <text x="840" y="24" text-anchor="end" fill="#f97316" class="title-font">glastor.es</text>

  <!-- Prompt & Command -->
  <g class="cmd-line">
    <text x="24" y="74" fill="#f97316" class="term-font" font-weight="700">$</text>
    <text x="40" y="74" fill="#f8fafc" class="term-font" font-weight="600">cargo run --release --bin spec-stream-server -- bench</text>
  </g>
  <line x1="24" y1="88" x2="836" y2="88" stroke="#1e293b" stroke-width="1"/>

  <!-- Animated Output Lines -->
  <text x="24" y="112" fill="#e2e8f0" class="term-font row-0">SPEC-STREAM REPRODUCIBLE BENCHMARK SUITE (Pure Safe Rust)</text>
  <text x="24" y="137" fill="#94a3b8" class="term-font row-1">Workload: 16 concurrent streams | 32 tok/stream | 512 tokens target</text>
  <text x="24" y="162" fill="#f59e0b" class="term-font row-2">[1/2] Autoregressive Baseline ..........   412 tok/s  (p99: 38.4 ms)</text>
  <text x="24" y="187" fill="#34d399" class="term-font row-3">[2/2] Speculative Engine (K=4, Paged KV) 1,290 tok/s  (p99: 11.9 ms)</text>
  <text x="24" y="212" fill="#38bdf8" class="term-font row-4">Speedup: 3.13x throughput  |  Acceptance: 78.4%  |  O(1) KV Rollback</text>
  <text x="24" y="237" fill="#34d399" class="term-font row-5">Zero allocations in rollback path  |  OpenAI SSE ready on :8080</text>

  <!-- Bottom Prompt Cursor -->
  <text x="24" y="268" fill="#f97316" class="term-font" font-weight="700">$</text>
  <rect x="38" y="256" width="8" height="14" fill="#f97316" class="cursor"/>
</svg>
